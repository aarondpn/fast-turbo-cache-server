# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/), run in CI by the
# `deny` job and locally with `cargo deny check`.

[advisories]
# RustSec advisory database: vulnerabilities always fail; unmaintained/unsound/yanked crates
# fail as well so they are noticed and either replaced or explicitly ignored here (with reason).
unmaintained = "all"
yanked = "deny"
ignore = [
    # quick-xml 0.39 (only used by object_store 0.13 to parse the XML answers of the configured
    # S3/GCS/Azure endpoint, i.e. not attacker-controlled input). Fixed in quick-xml 0.41, which
    # needs object_store 0.14 (reqwest 0.13); remove both entries with that upgrade.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39 via object_store 0.13; parses object store endpoint responses only" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39 via object_store 0.13; parses object store endpoint responses only" },
    # chrono and humantime were declared unmaintained (all versions, no patched release); neither
    # advisory reports a vulnerability. object_store needs both (0.14 still does), and the server
    # uses chrono directly for timestamps (web identity session name, object store janitor).
    # Remove the entries once object_store has moved off them and the direct chrono use is
    # replaced (jiff or time, as the advisory suggests).
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained notice without a known vulnerability; required by object_store and used directly for timestamps" },
    { id = "RUSTSEC-2026-0542", reason = "humantime: unmaintained notice (wraps chrono) without a known vulnerability; only pulled in by object_store" },
]

[licenses]
# Permissive licenses compatible with distributing fast-turbo-cache-server under MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # webpki-roots (Mozilla CA bundle data)
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
