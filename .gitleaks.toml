# gitleaks configuration: the default rules, minus the well-known test values of this repository.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures"
regexes = [
  # CI-only credentials of the bundled RustFS (docs/development.md, .github/workflows/ci.yml).
  '''ci-secret-key-0123456789''',
  # Azurite's public development account key.
  '''Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50u''',
  # Dummy SigV4 secrets in unit tests.
  '''^(0123456789abcdef)+''',
  # Compose variable references, not values.
  '''\$\$\{S3_ACCESS_KEY_ID\}''',
]
# Throwaway ES256 key that signs ID tokens in the OIDC integration tests.
paths = ['''^tests/it/oidc\.rs$''']
