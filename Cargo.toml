[package]
name = "fast-turbo-cache-server"
version = "0.1.0"
edition = "2024"
description = "Self-hosted Turborepo remote cache server in Rust for RustFS, Garage, S3, Google Cloud Storage, Azure Blob Storage and local storage"
license = "MIT"
repository = "https://github.com/aarondpn/fast-turbo-cache-server"
# Distributed as a Docker image, not on crates.io.
publish = false
# Minimum supported Rust version (let chains and the dependency tree). Verified in CI by the
# `msrv` job (`cargo +<rust-version> check --locked --all-targets`).
rust-version = "1.88"
readme = "README.md"
keywords = ["turborepo", "remote-cache", "s3", "rustfs", "garage"]
categories = ["command-line-utilities", "web-programming::http-server"]

[lib]
name = "fast_turbo_cache_server"
path = "src/lib.rs"

[[bin]]
name = "fast-turbo-cache-server"
path = "src/main.rs"

[[example]]
name = "bench_load"
path = "examples/bench_load.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
# `http2`: cleartext HTTP/2 (h2c) next to HTTP/1 in `axum::serve`.
axum = { version = "0.8", features = ["http2"] }
base64 = "0.22"
bytes = "1.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
fastrand = "2.3"
hmac = "0.13"
http = "1.1"
http-body-util = "0.1"
# OIDC ID token verification (`oidc`); RustCrypto backend (pure Rust, no C toolchain).
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
lru = { version = "0.18.5", default-features = false }
# Maps large spooled immutable uploads for the single conditional S3 `PUT` (no copy into RAM).
memmap2 = "0.9"
# S3, GCS and Azure clients (signing, retries, credentials, multipart uploads). Uses reqwest 0.12
# like the server; the HTTP clients are built by `storage::object` (no redirects, timeouts).
object_store = { version = "0.13", default-features = false, features = ["aws", "azure", "gcp"] }
percent-encoding = "2.3"
pin-project-lite = "0.2"
quick-xml = "0.42"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
tempfile = "3.12"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"

[dev-dependencies]
hex = "0.4"
# PEM test keys for signing ID tokens in the `oidc` integration tests.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
# Paused clock (`tokio::time::advance`) in timer tests.
tokio = { version = "1.40", features = ["test-util"] }
# `Response::json` in the HTTP tests.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

